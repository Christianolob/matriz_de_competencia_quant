<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quant Competence Matrix</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="canvas-wrap">
      <div class="title">
        <h1>Quant Competence Matrix</h1>
      </div>

      <svg
        id="tree"
        viewBox="0 0 2400 1800"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Quant skill tree"
      >
        <defs id="defs-layer"></defs>
        <g id="background-layer"></g>
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </svg>

      <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

      <div id="editor-toolbar" class="editor-toolbar" role="toolbar" aria-label="Editor toolbar">
        <button
          id="editor-toggle"
          type="button"
          class="editor-btn"
          aria-pressed="false"
          title="Toggle edit mode (E)"
        >
          Edit
        </button>
        <button
          id="editor-add"
          type="button"
          class="editor-btn"
          title="Add a new node at the viewport center"
          disabled
        >
          Add node
        </button>
        <button
          id="editor-connect"
          type="button"
          class="editor-btn"
          aria-pressed="false"
          title="Connect mode: click two nodes to add/remove an edge (Escape to exit)"
          disabled
        >
          Connect
        </button>
      </div>

      <div id="editor-save-error" class="editor-save-error" role="alert" hidden>
        <span class="editor-save-error__text"></span>
        <button
          type="button"
          class="editor-btn editor-save-error__retry"
        >
          Retry
        </button>
      </div>

      <aside id="editor-panel" class="editor-panel" aria-label="Node editor">
        <div class="editor-panel__header">
          <h2>Node</h2>
          <button
            id="editor-panel-close"
            type="button"
            class="editor-icon-btn"
            aria-label="Close panel"
          >
            &times;
          </button>
        </div>
        <div class="editor-panel__body">
          <label class="editor-field">
            <span>ID</span>
            <input id="editor-id" type="text" readonly />
          </label>
          <label class="editor-field">
            <span>Label</span>
            <input id="editor-label" type="text" />
          </label>
          <label class="editor-field">
            <span>Branch</span>
            <select id="editor-branch">
              <option value="modeling">Modeling</option>
              <option value="technology">Technology</option>
              <option value="finance">Finance</option>
              <option value="cross">Cross</option>
            </select>
          </label>
          <label class="editor-field">
            <span>Kind</span>
            <select id="editor-kind">
              <option value="root">Root</option>
              <option value="hub">Hub</option>
              <option value="detail">Detail</option>
              <option value="cross">Cross</option>
              <option value="apex">Apex</option>
            </select>
          </label>
          <label class="editor-field">
            <span>Description</span>
            <textarea id="editor-desc" rows="4"></textarea>
          </label>
          <div class="editor-field-row">
            <label class="editor-field">
              <span>x</span>
              <input id="editor-x" type="number" readonly />
            </label>
            <label class="editor-field">
              <span>y</span>
              <input id="editor-y" type="number" readonly />
            </label>
          </div>
          <div class="editor-panel__actions">
            <button id="editor-revert" type="button" class="editor-btn">
              Revert
            </button>
            <button
              id="editor-delete"
              type="button"
              class="editor-btn editor-btn--danger"
            >
              Delete
            </button>
          </div>
        </div>
      </aside>

    </main>

    <script type="module" src="main.js"></script>
    <script type="module" src="editor.js"></script>
  </body>
</html>
